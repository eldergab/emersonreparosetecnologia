<section>
    <h2>📋 Fazer Pedido</h2>

    <!-- ABAS -->
    <div>
        <button onclick="abrirAba('grafica')">🖨️ Gráfica</button>
        <button onclick="abrirAba('servico')">🔧 Serviços</button>
        <button onclick="abrirAba('reciclagem')">♻️ Reciclagem</button>
    </div>

    <!-- ================= GRAFICA ================= -->
    <div id="grafica" class="aba">
        <h3>Pedido - Gráfica Rápida</h3>

        <input id="tipoGrafica" placeholder="Tipo (banner, adesivo, etc)">
        <input id="largura" type="number" placeholder="Largura (m)">
        <input id="altura" type="number" placeholder="Altura (m)">
        <input id="valorMetro" type="number" placeholder="Valor por m²">

        <button onclick="calcularGrafica()">Calcular</button>

        <p id="resultadoGrafica"></p>

        <button onclick="enviarWhats('grafica')">Enviar Pedido</button>
    </div>

    <!-- ================= SERVIÇOS ================= -->
    <div id="servico" class="aba" style="display:none;">
        <h3>Pedido - Serviços</h3>

        <input id="tipoServico" placeholder="Tipo de serviço">
        <select id="modo">
            <option value="diaria">Por diária</option>
            <option value="unidade">Por unidade</option>
        </select>

        <input id="quantidade" type="number" placeholder="Quantidade">
        <input id="valorUnit" type="number" placeholder="Valor">

        <button onclick="calcularServico()">Calcular</button>

        <p id="resultadoServico"></p>

        <button onclick="enviarWhats('servico')">Enviar Pedido</button>
    </div>

    <!-- ================= RECICLAGEM ================= -->
    <div id="reciclagem" class="aba" style="display:none;">
        <h3>Coleta / Estopa</h3>

        <input id="tipoRec" placeholder="Tipo (estopa, coleta, etc)">
        <input id="peso" type="number" placeholder="Peso (kg)">
        <input id="valorKg" type="number" placeholder="Valor por kg">

        <button onclick="calcularRec()">Calcular</button>

        <p id="resultadoRec"></p>

        <button onclick="enviarWhats('reciclagem')">Enviar Pedido</button>
    </div>
</section>

<script>
function abrirAba(nome) {
    document.querySelectorAll('.aba').forEach(div => div.style.display = 'none');
    document.getElementById(nome).style.display = 'block';
}

// ===== CALCULOS =====
function calcularGrafica() {
    let l = parseFloat(largura.value) || 0;
    let a = parseFloat(altura.value) || 0;
    let v = parseFloat(valorMetro.value) || 0;

    let total = l * a * v;
    resultadoGrafica.innerText = "Total: R$ " + total.toFixed(2);
}

function calcularServico() {
    let q = parseFloat(quantidade.value) || 0;
    let v = parseFloat(valorUnit.value) || 0;

    let total = q * v;
    resultadoServico.innerText = "Total: R$ " + total.toFixed(2);
}

function calcularRec() {
    let p = parseFloat(peso.value) || 0;
    let v = parseFloat(valorKg.value) || 0;

    let total = p * v;
    resultadoRec.innerText = "Total: R$ " + total.toFixed(2);
}

// ===== ENVIO WHATSAPP =====
function enviarWhats(tipo) {
    let numero = "5562920026981";

    let texto = "";

    if (tipo === 'grafica') {
        texto = `Pedido Gráfica:
Tipo: ${tipoGrafica.value}
Largura: ${largura.value}
Altura: ${altura.value}
Valor/m²: ${valorMetro.value}
${resultadoGrafica.innerText}`;
    }

    if (tipo === 'servico') {
        texto = `Pedido Serviço:
Tipo: ${tipoServico.value}
Modo: ${modo.value}
Quantidade: ${quantidade.value}
Valor: ${valorUnit.value}
${resultadoServico.innerText}`;
    }

    if (tipo === 'reciclagem') {
        texto = `Pedido Reciclagem:
Tipo: ${tipoRec.value}
Peso: ${peso.value}
Valor/kg: ${valorKg.value}
${resultadoRec.innerText}`;
    }

    let url = `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
    window.open(url, '_blank');
}
</script>
