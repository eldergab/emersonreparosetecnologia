<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos Profissional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.4rem; color: var(--primary); }

        .card { background: var(--card); padding: 18px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .card h3 { margin-bottom: 15px; font-size: 1rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: var(--secondary); }
        
        input, select, textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 0.95rem; outline: none; transition: 0.2s; background: #fff;
        }
        input:focus { border-color: var(--primary); }

        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }

        /* Abas */
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn {
            padding: 10px; border: none; border-radius: 8px; background: #e2e8f0;
            cursor: pointer; font-weight: 600; color: var(--secondary); flex: 1; font-size: 0.85rem;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        /* Lista de Itens Adicionados */
        .lista-itens { margin-top: 15px; border-top: 1px dashed #cbd5e1; padding-top: 15px; }
        .item-adicionado {
            background: #f1f5f9; padding: 10px; border-radius: 8px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
        }
        .item-info b { color: var(--primary); }
        .btn-remove { background: none; border: none; color: var(--danger); cursor: pointer; padding: 5px; }

        /* Botão Adicionar */
        .btn-add {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer;
            margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .total-geral {
            background: var(--text); color: white; padding: 15px; border-radius: 8px;
            text-align: center; font-size: 1.3rem; font-weight: 800; margin: 20px 0;
        }

        .btn-send {
            width: 100%; background: var(--success); color: white; border: none;
            padding: 16px; border-radius: 8px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .aba { display: none; }
        .aba.active { display: block; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-shopping-cart"></i> Pedido de Vendas</h1>
    </header>

    <div class="card">
        <h3><i class="fas fa-id-card"></i> Cliente e Pagamento</h3>
        <div class="form-group">
            <label>Nome do Cliente / Empresa</label>
            <input type="text" id="clienteNome" placeholder="Quem está comprando?">
        </div>
        <div class="row">
            <div class="form-group">
                <label>WhatsApp</label>
                <input type="tel" id="clienteWhats" placeholder="(00) 00000-0000">
            </div>
            <div class="form-group">
                <label>Pagamento</label>
                <select id="pagamento">
                    <option value="PIX">PIX</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="abrirAba(event, 'grafica')">Gráfica</button>
        <button class="tab-btn" onclick="abrirAba(event, 'servico')">Serviços</button>
    </div>

    <div id="grafica" class="aba active">
        <div class="card">
            <h3><i class="fas fa-print"></i> Adicionar Item Gráfico</h3>
            <div class="form-group">
                <label>Descrição do Produto</label>
                <input type="text" id="gDesc" placeholder="Ex: Banner Aniversário">
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Cobrança por:</label>
                    <select id="gModo" onchange="toggleMedidas()">
                        <option value="m2">Metro Quadrado (m²)</option>
                        <option value="un">Unidade</option>
                        <option value="kit">Kit</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Preço (R$)</label>
                    <input type="number" id="gPreco" placeholder="0,00">
                </div>
            </div>

            <div id="medidasGrafica" class="row">
                <div class="form-group"><label>Largura (m)</label><input type="number" id="gLarg" step="0.01"></div>
                <div class="form-group"><label>Altura (m)</label><input type="number" id="gAlt" step="0.01"></div>
            </div>

            <div id="qtdGrafica" class="form-group hidden">
                <label>Quantidade</label>
                <input type="number" id="gQtd" value="1">
            </div>

            <button class="btn-add" onclick="adicionarItem('grafica')">
                <i class="fas fa-plus"></i> ADICIONAR AO PEDIDO
            </button>
        </div>
    </div>

    <div id="servico" class="aba">
        <div class="card">
            <h3><i class="fas fa-tools"></i> Adicionar Mão de Obra</h3>
            <div class="form-group">
                <label>Tipo de Serviço</label>
                <input type="text" id="sDesc" placeholder="Ex: Instalação Elétrica">
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Cobrança</label>
                    <select id="sModo">
                        <option value="un">Por Serviço (Un)</option>
                        <option value="diaria">Por Diária</option>
                        <option value="km">Por KM</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Valor (R$)</label>
                    <input type="number" id="sPreco" placeholder="0,00">
                </div>
            </div>
            <div class="form-group">
                <label>Quantidade / Dias</label>
                <input type="number" id="sQtd" value="1">
            </div>
            <button class="btn-add" onclick="adicionarItem('servico')">
                <i class="fas fa-plus"></i> ADICIONAR AO PEDIDO
            </button>
        </div>
    </div>

    <div class="card">
        <h3><i class="fas fa-list-ul"></i> Itens do Pedido</h3>
        <div id="listaItens">
            <p style="text-align: center; color: #94a3b8; font-size: 0.8rem;">Nenhum item adicionado.</p>
        </div>
        
        <div class="total-geral" id="totalExibicao">
            TOTAL: R$ 0,00
        </div>

        <button class="btn-send" onclick="enviarPedido()">
            <i class="fab fa-whatsapp"></i> FINALIZAR E ENVIAR
        </button>
    </div>
</div>

<script>
let carrinho = [];

function abrirAba(evt, nome) {
    document.querySelectorAll(".aba").forEach(a => a.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById(nome).classList.add("active");
    evt.currentTarget.classList.add("active");
}

function toggleMedidas() {
    const modo = document.getElementById('gModo').value;
    document.getElementById('medidasGrafica').classList.toggle('hidden', modo !== 'm2');
    document.getElementById('qtdGrafica').classList.toggle('hidden', modo === 'm2');
}

function adicionarItem(tipo) {
    let item = {};
    
    if (tipo === 'grafica') {
        const desc = document.getElementById('gDesc').value;
        const modo = document.getElementById('gModo').value;
        const preco = parseFloat(document.getElementById('gPreco').value) || 0;

        if (!desc || preco <= 0) return alert("Preencha descrição e valor!");

        if (modo === 'm2') {
            const l = parseFloat(document.getElementById('gLarg').value) || 0;
            const a = parseFloat(document.getElementById('gAlt').value) || 0;
            item = { desc: `${desc} (${l}x${a}m)`, total: l * a * preco, info: `${(l*a).toFixed(2)}m² x R$${preco}` };
        } else {
            const q = parseInt(document.getElementById('gQtd').value) || 1;
            item = { desc: `${desc} (${modo})`, total: q * preco, info: `${q}x R$${preco}` };
        }
    } 
    else if (tipo === 'servico') {
        const desc = document.getElementById('sDesc').value;
        const preco = parseFloat(document.getElementById('sPreco').value) || 0;
        const q = parseInt(document.getElementById('sQtd').value) || 1;
        const modo = document.getElementById('sModo').value;

        if (!desc || preco <= 0) return alert("Preencha o serviço e valor!");
        item = { desc: `${desc} (${modo})`, total: q * preco, info: `${q}x R$${preco}` };
    }

    carrinho.push(item);
    renderizarCarrinho();
    limparCampos();
}

function renderizarCarrinho() {
    const div = document.getElementById('listaItens');
    div.innerHTML = "";
    let soma = 0;

    carrinho.forEach((item, index) => {
        soma += item.total;
        div.innerHTML += `
            <div class="item-adicionado">
                <div class="item-info">
                    <b>${item.desc}</b><br>
                    <small>${item.info}</small>
                </div>
                <div style="text-align:right">
                    <b>R$ ${item.total.toFixed(2)}</b><br>
                    <button class="btn-remove" onclick="removerItem(${index})"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        `;
    });

    document.getElementById('totalExibicao').innerText = `TOTAL: R$ ${soma.toFixed(2)}`;
}

function removerItem(index) {
    carrinho.splice(index, 1);
    renderizarCarrinho();
}

function limparCampos() {
    document.querySelectorAll('input[type="number"], #gDesc, #sDesc').forEach(i => {
        if(i.id !== 'gPreco' && i.id !== 'vKg') i.value = "";
    });
}

function enviarPedido() {
    const nome = document.getElementById('clienteNome').value;
    if (!nome) return alert("Digite o nome do cliente!");
    if (carrinho.length === 0) return alert("Adicione pelo menos um item!");

    let msgItems = "";
    let totalGeral = 0;

    carrinho.forEach(item => {
        msgItems += `• ${item.desc}\n  _${item.info}_ → *R$ ${item.total.toFixed(2)}*\n\n`;
        totalGeral += item.total;
    });

    const texto = encodeURIComponent(
        `🚀 *NOVO PEDIDO CONFIRMADO*\n\n` +
        `👤 *Cliente:* ${nome}\n` +
        `💳 *Pagamento:* ${document.getElementById('pagamento').value}\n` +
        `📱 *WhatsApp:* ${document.getElementById('clienteWhats').value}\n` +
        `--------------------------------\n` +
        `${msgItems}` +
        `--------------------------------\n` +
        `💰 *TOTAL DO PEDIDO: R$ ${totalGeral.toFixed(2)}*`
    );

    window.open(`https://wa.me/5562920026981?text=${texto}`);
}
</script>

</body>
</html>
